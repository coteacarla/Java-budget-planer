<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2>Your Expenses</h2>

<form th:action="@{/add}" th:object="${expense}" method="post" class="row g-3 mb-4">
    <div class="col-md-3">
        <input type="text" th:field="*{category}" class="form-control" placeholder="Category" required />
    </div>
    <div class="col-md-3">
        <input type="text" th:field="*{description}" class="form-control" placeholder="Description" />
    </div>
    <div class="col-md-2">
        <input type="number" step="0.01" th:field="*{amount}" class="form-control" placeholder="Amount" required />
    </div>
    <div class="col-md-2">
        <input type="date" th:field="*{date}" class="form-control" required />
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Add</button>
    </div>
</form>

<table class="table table-bordered table-striped">
    <thead class="table-light">
    <tr>
        <th>Date</th>
        <th>Category</th>
        <th>Description</th>
        <th>Amount</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="exp : ${expenses}">
        <td th:text="${exp.date}"></td>
        <td th:text="${exp.category}"></td>
        <td th:text="${exp.description}"></td>
        <td th:text="${exp.amount}"></td>
        <td>
            <a th:href="@{'/delete/' + ${exp.id}}" class="btn btn-danger btn-sm">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="btn btn-secondary">Logout</button>
</form>

</body>
</html>

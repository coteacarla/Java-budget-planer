<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Expense</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 th:text="${#strings.isEmpty(expense.id) ? 'Add Expense' : 'Edit Expense'}"></h2>

<form th:action="@{/expenses/save}" th:object="${expense}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" th:field="*{description}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Amount</label>
        <input type="number" step="0.01" th:field="*{amount}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" th:field="*{category}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" th:field="*{date}" class="form-control" required />
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
</form>

</body>
</html>

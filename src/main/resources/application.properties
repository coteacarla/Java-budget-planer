spring.application.name=expense-tracker
# === H2 DATABASE CONFIG ===
server.port=8081
spring.datasource.url=jdbc:h2:file:./data/expensedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=budget-dev-password

# === JPA / Hibernate ===
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# === H2 Console (for debugging in browser) ===
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=change-this-development-secret-key-which-is-at-least-32-bytes
